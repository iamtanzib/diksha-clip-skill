<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Source file. Edit tools/index.src.html, then run: python -I tools/build.py -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_24pt-Regular.ttf"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_24pt-Medium.ttf"); font-weight: 500; font-style: normal; }
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_36pt-Bold.ttf"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_36pt-ExtraBold.ttf"); font-weight: 800; font-style: normal; }
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_36pt-Italic.ttf"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_36pt-MediumItalic.ttf"); font-weight: 500; font-style: italic; }
      @font-face { font-family: "DM Sans Brand"; src: url("assets/fonts/DMSans_36pt-SemiBoldItalic.ttf"); font-weight: 600; font-style: italic; }
      @font-face { font-family: "Roboto UI"; src: url("assets/fonts/Roboto-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Roboto UI"; src: url("assets/fonts/Roboto-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "Roboto UI"; src: url("assets/fonts/Roboto-Bold.ttf"); font-weight: 700; }

      :root {
        --bg: #f6f8fb; --dot: #d5dce8; --fg: #0f172a; --muted: #64748b; --line: #e2e8f0;
        --accent: #2563eb; --accent-soft: #dbeafe; --accent-mid: #93c5fd;
        --card-shadow: 0 30px 80px rgba(15, 23, 42, 0.12), 0 4px 14px rgba(15, 23, 42, 0.06);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "DM Sans Brand", sans-serif; color: var(--fg); }

      /* ---------- background (keep) ---------- */
      #bg { position: absolute; inset: 0; background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px); background-size: 30px 30px; background-position: 15px 15px; }
      #bg-glow { position: absolute; left: 90px; top: 120px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.12), rgba(37, 99, 235, 0) 65%); }
      #bg-fade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 34%, rgba(246, 248, 251, 0) 40%, rgba(246, 248, 251, 0.92) 85%); }

      /* ---------- graphics area (keep) ---------- */
      #gfx, #screen { position: absolute; left: 0; top: 0; width: 1080px; height: 1260px; overflow: hidden; }
      .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1260px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1260px; transform-origin: 0 0; }
      .abs { position: absolute; }

      /* ---------- shared visual language (keep, extend) ---------- */
      .head { position: absolute; left: 50px; right: 50px; top: 150px; text-align: center; font-weight: 800; font-size: 74px;
        line-height: 1.05; letter-spacing: -0.035em; color: var(--fg); opacity: 0; }
      .head i { font-style: italic; font-weight: 500; color: var(--accent); letter-spacing: -0.02em; }
      .card { position: absolute; background: #fff; border-radius: 32px; box-shadow: var(--card-shadow); border: 1px solid rgba(15, 23, 42, 0.06); }
      .pill { display: inline-flex; align-items: center; gap: 12px; padding: 10px 26px; border-radius: 999px; background: var(--accent); color: #fff;
        font-weight: 700; font-size: 40px; letter-spacing: -0.02em; box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.12), 0 12px 34px rgba(37, 99, 235, 0.35); }
      .pill.soft { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
      .pill.dark { background: var(--fg); color: #fff; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25); }
      .hl-wrap { position: relative; z-index: 0; }
      .mark { position: absolute; left: -6px; right: -6px; top: 2px; bottom: 0; border-radius: 8px; z-index: -1; background: rgba(37, 99, 235, 0.2); transform-origin: 0 50%; }
      .lines { background-image: linear-gradient(rgba(37, 99, 235, 0.22), rgba(37, 99, 235, 0.22)); background-repeat: no-repeat; background-size: 0% 100%;
        -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 6px; padding: 0 4px; margin: 0 -4px; }
      .cursor { position: absolute; width: 40px; height: 56px; opacity: 0; transform-origin: 6px 4px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
      .ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; }

      /* ---------- screen share layout (keep) ---------- */
      #screen { opacity: 0; }
      #screen-card { position: absolute; left: 30px; top: 330px; width: 1020px; border-radius: 26px; overflow: hidden; box-shadow: var(--card-shadow); background: #000; }
      #screen-card video { display: block; width: 100%; height: auto; }

      /* ---------- people (keep) ---------- */
      #inset { position: absolute; left: 54px; top: 1290px; width: 972px; height: 630px; border-radius: 44px 44px 0 0; overflow: hidden;
        box-shadow: 0 -10px 60px rgba(15, 23, 42, 0.16), 0 0 0 1px rgba(15, 23, 42, 0.06); background: #d9dde3; }
      .wrap { position: absolute; inset: 0; opacity: 0; }
      .wrap video { position: absolute; inset: 0; width: 100%; height: 100%; }
      .cell { position: absolute; left: 0; width: 1080px; height: 960px; overflow: hidden; opacity: 0; }
      .cell video { position: absolute; inset: 0; width: 100%; height: 100%; }
      #st-guest { top: 0; }
      #st-host { top: 960px; }
      #seam { position: absolute; left: 0; right: 0; top: 957px; height: 6px; background: #fff; opacity: 0; box-shadow: 0 0 18px rgba(15, 23, 42, 0.22); }
      .full { position: absolute; inset: 0; opacity: 0; }
      .full video { position: absolute; inset: 0; width: 100%; height: 100%; }

      /* ---------- this clip's scenes ---------- */
      #demo-card { left: 140px; top: 420px; width: 800px; padding: 50px; font-size: 52px; font-weight: 800; letter-spacing: -0.03em; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-fps="24" data-start="0" data-duration="{{D}}" data-width="1080" data-height="1920">
      <div id="bg"><div id="bg-glow"></div><div id="bg-fade"></div></div>

      <div id="gfx">
        <!-- One <section class="clip scene"> per graphic idea. Replace this demo. -->
        <section id="s1" class="clip scene" data-start="0" data-duration="{{T:4.75}}" data-track-index="2">
          <h1 class="head" id="s1-head">Demo <i>scene</i></h1>
          <div class="card" id="demo-card"><span id="demo-words">By the time the video had</span></div>
        </section>
      </div>

      <div id="screen"><div class="cam" id="screen-cam"><div id="screen-card">
        <video id="v-screen" class="clip" src="assets/screen.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="1"></video>
      </div></div></div>

      <div id="inset">
        <div class="wrap" id="inset-guest"><video id="v-gi" class="clip" src="assets/guest_inset.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="0"></video></div>
        <div class="wrap" id="inset-host"><video id="v-hi" class="clip" src="assets/host_inset.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="1"></video></div>
      </div>
      <div class="cell" id="st-guest"><video id="v-gc" class="clip" src="assets/guest_cell.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="0"></video></div>
      <div class="cell" id="st-host"><video id="v-hc" class="clip" src="assets/host_cell.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="1"></video></div>
      <div id="seam"></div>
      <div class="full" id="full-guest"><video id="v-gf" class="clip" src="assets/guest_full.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="0"></video></div>
      <div class="full" id="full-host"><video id="v-hf" class="clip" src="assets/host_full.mp4" muted playsinline data-start="0" data-duration="{{D}}" data-track-index="1"></video></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="{{D}}" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="{{D}}" data-track-index="5" data-volume="0.8"></audio>
    </div>

    <script>
      const DATA = __DATA__;
      const tl = gsap.timeline({ paused: true });
      /*__KIT__*/

      applyLayouts();
      tl.fromTo("#bg-glow", { scale: 0.92, opacity: 0.8 }, { scale: 1.08, opacity: 1, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 10 }, 0);

      // ===================== S1 (demo: replace) =====================
      {
        blurIn("#s1-head", 0, 0.6, 20);
        popIn("#demo-card", 0.1);
        splitWords("#demo-words");
        wordsUp("#demo-words", ["By", "the", "time", "the", "video", "had"].map((w, i) => W(w, i < 3 ? 0 : i === 3 ? 1 : 0)));
      }

      breathe("#gfx", 0, DUR);   // keep: the frame is never dead
      auditOverlaps();                                                    // keep: lists fighting tweens in the console
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
